services:
  - type: web
    name: fielded-job-board
    runtime: python
    buildCommand: pip install -r requirements.txt && python load_data.py data/jobs_normalized.json.gz --reset
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
